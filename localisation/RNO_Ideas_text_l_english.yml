l_english:
 The_King_Support_neutral:0 "The King's Support"
 The_King_Support_neutral_desc:0 "The King neither Supports nor opposes our regime, but his tacit approval provides us with a degree of legitimacy in the eyes of the populace. While his disapproval would be a significant blow to our cause, his support could help us consolidate power and stabilize the nation."
 The_King_Support_Slightly_Positive:0 "The King's Support (Slightly Positive)"
 The_King_Support_Slightly_Positive_desc:0 "The King has expressed a degree of support for our regime, which has bolstered our legitimacy and strengthened our position. His endorsement has helped to sway public opinion in our favor, making it easier to implement our policies and maintain order. While not fully committed to our cause, the King's support is a valuable asset that we must nurture and cultivate."
 The_King_Support_Positive:0 "The King's Support (Positive)"
 The_King_Support_Positive_desc:0 "The King is a staunch supporter of our regime, and his unwavering endorsement has been instrumental in solidifying our power. His support has not only enhanced our legitimacy but has also rallied the populace behind our cause. With the King's backing, we have been able to implement our policies with greater ease and effectiveness. His commitment to our vision for the nation is a powerful force that we must continue to leverage."
 The_King_Support_Very_Positive:0 "The King's Support (Very Positive)"
 The_King_Support_Very_Positive_desc:0 "The King is an ardent supporter of our regime, and his passionate endorsement has been a cornerstone of our legitimacy and authority. His unwavering commitment to our cause has galvanized the populace, inspiring widespread support and enthusiasm for our policies. With the King's fervent backing, we have been able to enact significant reforms and initiatives that have transformed the nation. His dedication to our vision is an invaluable asset that we must cherish and uphold."
 The_constitution:0 "The Constitution"
 The_constitution_desc:0 "The constitution serves as the foundation of our nation's legal and political framework. It outlines the rights and responsibilities of citizens, the structure of government, and the principles that guide our society. Upholding the constitution is essential for maintaining order, protecting individual freedoms, and ensuring the rule of law."
 The_King:0 "The King"
 The_King_desc:0 "The King is the head of state and a symbol of our nation's continuity and stability. However he also pursues his own agenda and must be watched carefully."
 The_King_Support_Slightly_Negative:0 "The King's Support (Slightly Negative)"
 The_King_Support_Slightly_Negative_desc:0 "The King has expressed some reservations about our regime, which has created challenges for our legitimacy and authority."
 The_King_Support_Negative:0 "The King's Support (Negative)"
 The_King_Support_Negative_desc:0 "The King is openly critical of our regime, which has significantly undermined our legitimacy and authority."
 The_King_Support_Very_Negative:0 "The King's Support (Very Negative)"
 The_King_Support_Very_Negative_desc:0 "The King is a vehement opponent of our regime, and his staunch resistance has severely compromised our legitimacy and authority."
 The_Army:0 "The Army"
 The_Army_desc:0 "The Army is a crucial pillar of our nation's defense and security. It is responsible for protecting our borders, maintaining internal order, and supporting our foreign policy objectives."
 The_Navy:0 "The Navy"
 The_Navy_desc:0 "The Navy is a vital component of our nation's military capabilities, responsible for safeguarding our maritime interests, projecting power abroad, and ensuring the security of our sea lanes."
 The_Air_Force:0 "The Air Force"
 The_Air_Force_desc:0 "The Air Force plays a critical role in our nation's defense strategy, providing air superiority, reconnaissance, and support for ground and naval operations."
 The_Economy:0 "The Economy"
 The_Economy_desc:0 "A strong and resilient economy is essential for our nation's prosperity and stability. It provides the resources necessary to support our military, social programs, and infrastructure development."
 Our_Colonial_Empire:0 "Our Colonial Empire"
 Our_Colonial_Empire_desc:0 "Our colonial empire represents a significant source of wealth, resources, and strategic influence. It is imperative that we maintain control over our colonies to ensure the continued prosperity and security of our nation."
  modernized_republic:0 "Modernized Republic"
  modernized_republic_desc:0 "the modernization of the republic went well, the universitys are blooming and the scientists are happy, old infrastructure has been replaced with modern buildings and factories"
 State_of_the_Economy:0 "State of the Economy"
 State_of_the_Economy_desc:0 "The economy needs to be improved, the factories are old and the workers are unhappy, the universities are underfunded and the scientists are leaving the country. We must set new Polocies to improve the economy and make the country prosperous again."
 Buddies_Reign:0 "Buddies Reign"
 Buddies_Reign_desc:0 "The Kind has revoked the Constitution and declared himself the sole ruler of the country long Live the King! Glory to the Kingdom!"
 RNO_king_constitution_balance:0 "The Constitutional Struggle"  # FIXED: was RNO_KingConstitution_balance
Buying_The_East_Indies:0 "Buying The East Indies"
Buying_Burma:0 "Buying Burma"
Payments_From_East_Burma:0 "Payment for Burma"
Payments_From_East_Indies:0 "Payment for the East Indies"
Remnents_of_the_Revolution:0 "Remnants of the Revolution"
Remnents_of_the_Revolution_desc:0 "The revolution may be over, but its shadow still loom over us making our Politics and Society unstable."
 RNO_Guarantee_FRA:0 "Guaranteed by the Republic of the Newest Order"
 RNO_Guarantee_FRA_desc:0 "The Republic of the Newest Order has guaranteed this nation and will join any defensive wars on there side."
 RNO_Guarantee_Dutch:0 "Guaranteed by the Republic of the Newest Order"
 RNO_Guarantee_Dutch_desc:0 "The Republic of the Newest Order has guaranteed this nation and will join any defensive wars on there side."
 Guarantee_Refused:0 "Guarantee Refused"
 Guarantee_Refused_desc:0 "Our Refusal to honor our guarantee has caused a diplomatic incident and may have damaged our reputation on the international stage and also left us internally unstable."
 Offer_Help_Against_Japan_for_Chinese_Colonies:0 "Offer Help Against Japan for Chinese Colonies"
 Offer_Help_Against_Japan_for_Chinese_Colonies_desc:0 "With China and Japan locked in war, we can offer our military assistance in exchange for puppet states. This will expand our influence in Asia significantly."
 RNO_Help_China_Japan.1:0 "The Republic of the Newest Order Offers Help Against Japan"
 RNO_Help_China_Japan.1_desc:0 "The Republic of the Newest Order has approached us with an offer to join our war against Japan. In exchange, they request that we become their puppet states. This could turn the tide of the war, but at what cost to our sovereignty?"
 RNO_Help_China_Japan.2:0 "China Refuses Our Offer"
 RNO_Help_China_Japan.2_desc:0 "China has refused our offer of military assistance against Japan. They prefer to fight alone rather than accept our terms."
 RNO_Help_China_Japan.3:0 "China Accepts Our Offer"
 RNO_Help_China_Japan.3_desc:0 "China has accepted our terms. They will become our puppet states and we will join their war against Japan. The Guangxi Clique and the Guangdong Government are now under our protection."
 Chinese_Colonies:0 "Chinese Colonies"
 Chinese_Colonies_desc:0 "With China under our protection, we have gained valuable resources and manpower from our new puppet states."
 Request_Chinese_Manpower:0 "Request Chinese Manpower"
 Request_Chinese_Manpower_desc:0 "We can request additional manpower from China in exchange for temporary financial support, though it will come with organizational challenges."
 RNO_Request_Chinese_Manpower.1:0 "The Republic Requests Chinese Manpower"
 RNO_Request_Chinese_Manpower.1_desc:0 "The Republic of the Newest Order has requested that we provide them with 500,000 manpower in exchange for temporary financial support. This will weaken our military capabilities but strengthen our allies."
 RNO_Request_Chinese_Manpower.2:0 "China Refuses Our Manpower Request"
 RNO_Request_Chinese_Manpower.2_desc:0 "China has refused our request for manpower, stating they cannot spare the troops."
 RNO_Request_Chinese_Manpower.3:0 "China Provides Manpower"
 RNO_Request_Chinese_Manpower.3_desc:0 "China has agreed to provide us with 500,000 manpower. We now have a permanent organization penalty but are temporarily paying them for the support."
 Chinese_Manpower_Organization_Penalty:0 "Language and Cultural Barriers"
 Chinese_Manpower_Organization_Penalty_desc:0 "The influx of Chinese manpower has caused organizational challenges in our military structure."
 Paying_China_for_Manpower:0 "Paying China for Manpower"
 Paying_China_for_Manpower_desc:0 "We are temporarily paying China for the manpower they provided to us."
 payments_from_RNO:0 "Payments from the Republic of the Newest Order"
 payments_from_RNO_desc:0 "We are receiving temporary financial support from the Republic for providing them with manpower."
 Japanise_Pacific_Holdings:0 "Japanese Pacific Holdings"
 Japanise_Pacific_Holdings_desc:0 "We have secured control over the Japanese Pacific Holdings, expanding our influence in the region without needing to specify exact territory."
 RNO_Help_Japan_China.1:0 "The Republic Offers Help Against China"
 RNO_Help_Japan_China.1_desc:0 "The Republic of the Newest Order has offered us support against China in exchange for recognition of their claims on the Japanise Pacific Holdings."
 RNO_Help_Japan_China.2:0 "Japan Declines Our Offer"
 RNO_Help_Japan_China.2_desc:0 "Japan has declined our offer of military assistance, unwilling to commit to our terms."
 RNO_Help_Japan_China.3:0 "Japan Accepts Our Offer"
 RNO_Help_Japan_China.3_desc:0 "Japan has accepted our offer and granted us the Japanise Pacific Holdings as part of the agreement."
 RNO_Japanese_Naval_Advisors:0 "Japanese Naval Advisors"
 RNO_Japanese_Naval_Advisors_desc:0 "Japan has send some Naval Advisors to help the Republic with its Navy."